<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="amneziawg-gui: one-click AmneziaWG for Linux desktops">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#131925"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.6" stop-color="#2ee6a8" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#2ee6a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2ee6a8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2ee6a8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>

  <!-- live traffic graph -->
  <path d="M0 400 V345 C80 305 140 365 220 325 S380 275 460 335 S620 305 700 345 S860 295 940 335 S1100 305 1180 325 L1280 335 V400 Z" fill="url(#area)"/>
  <path d="M0 345 C80 305 140 365 220 325 S380 275 460 335 S620 305 700 345 S860 295 940 335 S1100 305 1180 325 L1280 335" fill="none" stroke="#2ee6a8" stroke-width="3" stroke-opacity="0.65"/>
  <path d="M0 372 C120 362 220 378 340 368 S560 360 680 370 S900 362 1020 368 S1180 364 1280 366" fill="none" stroke="#8b7bff" stroke-width="2.5" stroke-opacity="0.6"/>

  <!-- the power button -->
  <circle cx="250" cy="185" r="150" fill="url(#halo)"/>
  <circle cx="250" cy="185" r="102" fill="#151922" stroke="#7d8496" stroke-width="2"/>
  <circle cx="250" cy="185" r="86" fill="none" stroke="#2ee6a8" stroke-width="10"/>
  <path d="M231 157.1 A38 38 0 1 0 269 157.1" fill="none" stroke="#2ee6a8" stroke-width="12" stroke-linecap="round"/>
  <line x1="250" y1="142.5" x2="250" y2="182.4" stroke="#2ee6a8" stroke-width="12" stroke-linecap="round"/>

  <!-- title -->
  <g font-family="Inter, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
    <text x="470" y="150" font-size="66" font-weight="700" fill="#e8ebf2">amneziawg-gui</text>
    <text x="473" y="200" font-size="26" fill="#9aa1b2">One-click AmneziaWG for Linux desktops.</text>
    <text x="473" y="236" font-size="26" fill="#9aa1b2">Real tunnels, honest status, no root GUI.</text>
    <g font-size="17" font-weight="600">
      <rect x="473" y="262" width="104" height="34" rx="17" fill="#151922" stroke="#242a3a"/>
      <text x="525" y="285" text-anchor="middle" fill="#2ee6a8">systemd</text>
      <rect x="589" y="262" width="88" height="34" rx="17" fill="#151922" stroke="#242a3a"/>
      <text x="633" y="285" text-anchor="middle" fill="#2ee6a8">polkit</text>
      <rect x="689" y="262" width="148" height="34" rx="17" fill="#151922" stroke="#242a3a"/>
      <text x="763" y="285" text-anchor="middle" fill="#8b7bff">PySide6 · Qt 6</text>
      <rect x="849" y="262" width="150" height="34" rx="17" fill="#151922" stroke="#242a3a"/>
      <text x="924" y="285" text-anchor="middle" fill="#ffb547">AmneziaWG 3.x</text>
    </g>
  </g>
</svg>
